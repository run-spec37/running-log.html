<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>練習日誌</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#12161d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="練習日誌">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root {
    --bg: #12161d;
    --surface: #1b212b;
    --surface-2: #232b37;
    --text: #eef1f5;
    --text-dim: #8b93a3;
    --accent: #c9f31d;
    --accent-text: #12161d;
    --danger: #ff5d5d;
    --border: #2a3341;
    --z1: #4fc3a1;
    --z2: #8bc34a;
    --z3: #c9f31d;
    --z4: #ff9f45;
    --z5: #ff5d5d;
    --rest: #8a94a6;
    --race: #ffd54f;
    --cross: #7b93ff;
    --customcat: #c792ea;
    --aux: #64d9e8;
    --m-blue: #4a90e2;
    --m-green: #4caf50;
    --m-yellowgreen: #b5c62e;
    --m-yellow: #ffd400;
    --m-orange: #ff8f2e;
    --m-red: #ff5252;
    --m-gold: #ffd54f;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 480px; margin: 0 auto; padding: 20px 14px 90px; }

  .tab-bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: var(--surface);
    border-top: 1px solid var(--border);
    display: flex;
    gap: 8px;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    z-index: 15;
  }
  .tab-btn {
    flex: 1;
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 14px;
    font-weight: 700;
    padding: 11px 0;
    border-radius: 12px;
  }
  .tab-btn.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: transparent;
  }

  .ratio-bar {
    display: flex;
    height: 22px;
    border-radius: 8px;
    overflow: hidden;
    margin-bottom: 16px;
    background: var(--surface-2);
  }
  .ratio-bar .seg { height: 100%; }
  .ratio-legend { display: flex; flex-direction: column; gap: 10px; }
  .ratio-legend .row { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .ratio-legend .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  .ratio-legend .name { flex: 1; color: var(--text); }
  .ratio-legend .pct { font-weight: 700; font-variant-numeric: tabular-nums; }
  .ratio-legend .km { color: var(--text-dim); font-size: 12px; width: 64px; text-align: right; font-variant-numeric: tabular-nums; }

  header { margin-bottom: 20px; }
  header .eyebrow { font-size: 12px; color: var(--text-dim); letter-spacing: 0.04em; }
  header h1 { font-size: 22px; margin: 4px 0 0; font-weight: 700; }

  .dash {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 20px;
  }
  .dash-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px 10px;
  }
  .dash-card .label { font-size: 11px; color: var(--text-dim); }
  .dash-card .num {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-top: 4px;
    font-variant-numeric: tabular-nums;
  }
  .dash-card .num span { font-size: 12px; font-weight: 500; color: var(--text-dim); margin-left: 2px; }
  .dash-card .sub { font-size: 10px; color: var(--text-dim); margin-top: 2px; }

  section.block {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 14px;
    margin-bottom: 16px;
  }

  .month-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .month-nav button {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    width: 34px; height: 34px;
    border-radius: 9px;
    font-size: 16px;
  }
  .month-nav .label { font-size: 15px; font-weight: 700; }

  .day-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 4px;
    border-bottom: 1px solid var(--border);
  }
  .day-row:last-child { border-bottom: none; }
  .day-row.today { background: rgba(201,243,29,0.06); border-radius: 8px; }
  .day-row.empty .menu-chip { visibility: hidden; }
  .day-row .date-col {
    flex: none;
    width: 52px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.3;
  }
  .day-row.today .date-col { color: var(--accent); font-weight: 700; }
  .day-row .date-col .dow { font-size: 10px; }
  .day-row .train-col {
    flex: 7;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    cursor: pointer;
  }
  .day-row .cond-col {
    flex: 3;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    border-left: 1px solid var(--border);
    padding-left: 8px;
    cursor: pointer;
  }
  .col-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 4px 6px;
    font-size: 11px;
    color: var(--text-dim);
    font-weight: 700;
  }
  .col-header .date-col { width: 52px; flex: none; }
  .col-header .train-col { flex: 7; }
  .col-header .cond-col { flex: 3; border-left: 1px solid var(--border); padding-left: 8px; }
  .day-row .mid-col {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .menu-chip {
    flex: none;
    font-size: 11px;
    font-weight: 700;
    padding: 3px 8px;
    border-radius: 999px;
    color: var(--accent-text);
    white-space: nowrap;
    cursor: pointer;
  }
  .day-row .comment-hint {
    font-size: 11px;
    color: var(--text-dim);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 100%;
  }
  .day-row .right-col {
    flex: none;
    text-align: right;
    font-size: 13px;
    font-weight: 700;
    min-width: 44px;
  }
  .day-row .right-col .rpe {
    display: block;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-dim);
    margin-top: 1px;
  }
  .day-row .placeholder { color: var(--text-dim); font-size: 12px; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
  .field input[type="date"],
  .field input[type="number"],
  .field textarea {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 11px 12px;
    font-size: 16px;
    font-family: inherit;
  }
  .field textarea { resize: vertical; min-height: 140px; font-size: 16px; line-height: 1.5; }
  .field.hidden { display: none; }

  .menu-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 6px;
  }
  .menu-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 9px 2px;
    font-size: 12px;
    font-weight: 700;
    text-align: center;
  }
  .menu-btn.selected { border-color: transparent; color: var(--accent-text); }

  .rpe-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }
  .rpe-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 0;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }
  .rpe-btn.selected { border-color: transparent; color: var(--accent-text); }
  .rpe-hint { margin-top: 8px; font-size: 12px; color: var(--text-dim); text-align: center; min-height: 16px; }

  .scale-btn {
    border: 1px solid var(--border);
    background: var(--surface-2);
    color: var(--text);
    border-radius: 10px;
    padding: 10px 0;
    font-size: 15px;
    font-weight: 700;
    text-align: center;
  }
  .scale-btn.selected { border-color: transparent; color: var(--accent-text); }

  .pain-row { display:flex; gap:8px; align-items:flex-end; margin-bottom:10px; }
  .pain-row .del-btn {
    background: none; border: none; color: var(--text-dim);
    font-size: 18px; padding: 0 4px 10px;
  }

  .btn-primary {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 16px;
    font-weight: 700;
    margin-top: 4px;
  }
  .btn-secondary {
    width: 100%;
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    margin-top: 8px;
  }
  .btn-danger-outline {
    width: 100%;
    background: transparent;
    color: var(--danger);
    border: 1px solid var(--danger);
    border-radius: 12px;
    padding: 12px;
    font-size: 14px;
    margin-top: 8px;
  }

  .fab {
    position: fixed;
    left: 50%;
    bottom: 22px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 448px;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 14px;
    padding: 15px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }

  .sheet-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.55);
    display: none;
    align-items: flex-end;
    z-index: 10;
  }
  .sheet-backdrop.open { display: flex; }
  .sheet {
    background: var(--bg);
    width: 100%;
    max-width: 480px;
    margin: 0 auto;
    border-radius: 20px 20px 0 0;
    padding: 18px 16px calc(18px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow-y: auto;
    border-top: 1px solid var(--border);
  }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .sheet-head h3 { margin: 0; font-size: 16px; }
  .sheet-head button { background: none; border: none; color: var(--text-dim); font-size: 14px; }

  .toast {
    position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
    background: var(--surface-2); border: 1px solid var(--border);
    color: var(--text); padding: 10px 16px; border-radius: 10px;
    font-size: 13px; z-index: 20; opacity: 0; transition: opacity 0.2s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div style="display:flex; align-items:center; justify-content:space-between;">
      <div>
        <div class="eyebrow">TRAINING LOG</div>
        <h1>練習日誌</h1>
      </div>
      <button id="profileButton" style="background:var(--surface); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:8px 12px; font-size:13px; font-weight:700; display:flex; align-items:center; gap:6px;">
        <span>👤</span><span id="profileNameLabel">自分</span>
      </button>
    </div>
  </header>

  <div class="month-nav">
    <button id="prevMonth">‹</button>
    <div class="label" id="monthLabel">2026年9月</div>
    <button id="nextMonth">›</button>
  </div>

  <div id="calendarView">
    <section class="block">
      <div class="col-header">
        <div class="date-col"></div>
        <div class="train-col">練習</div>
        <div class="cond-col">コンディション</div>
      </div>
      <div id="calendar"></div>
    </section>
  </div>

  <div id="dataView" style="display:none;">
    <div class="dash">
      <div class="dash-card">
        <div class="label">過去7日間</div>
        <div class="num" id="sum7">0<span>km</span></div>
      </div>
      <div class="dash-card">
        <div class="label">過去30日間</div>
        <div class="num" id="sum30">0<span>km</span></div>
      </div>
      <div class="dash-card">
        <div class="label">ACWR</div>
        <div class="num" id="acwr">-</div>
        <div class="sub" id="acwrSub">&nbsp;</div>
      </div>
      <div class="dash-card">
        <div class="label">過去7日間の運動時間</div>
        <div class="num" id="time7">0<span>分</span></div>
      </div>
    </div>

    <section class="block">
      <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
        <div style="font-size:14px; font-weight:700; color:var(--text-dim);">強度割合（<span id="colorRatioMonthLabel"></span>・Run）</div>
        <select id="ratioMetricSelect" style="background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:8px; padding:6px 8px; font-size:12px; font-family:inherit;">
          <option value="distance">距離</option>
          <option value="frequency">頻度</option>
          <option value="time">時間</option>
        </select>
      </div>
      <div id="colorRatioChart"></div>
    </section>

    <section class="block">
      <div style="font-size:14px; font-weight:700; color:var(--text-dim); margin-bottom:12px;">目標</div>
      <div class="field">
        <label>長期目標</label>
        <textarea id="goalLongTerm" placeholder="例：来年の県大会で自己ベスト更新" style="min-height:80px; font-size:17px;"></textarea>
      </div>
      <div class="field" style="margin-bottom:0;">
        <label>短期目標</label>
        <textarea id="goalShortTerm" placeholder="例：来月までに5000mのペースを上げる" style="min-height:80px; font-size:17px;"></textarea>
      </div>
    </section>

    <section class="block">
      <div style="font-size:14px; font-weight:700; color:var(--text-dim); margin-bottom:12px;">PB</div>
      <div id="pbTable"></div>
    </section>
  </div>
</div>

<div class="tab-bar">
  <button class="tab-btn active" id="tabCalendarBtn">カレンダー</button>
  <button class="tab-btn" id="tabDataBtn">データ</button>
</div>

<div class="sheet-backdrop" id="backdrop">
  <div class="sheet">
    <div class="sheet-head">
      <h3 id="sheetTitle">記録を追加</h3>
      <button id="closeSheet">閉じる</button>
    </div>

    <div class="field">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>日付</label>
          <input type="date" id="fDate">
        </div>
        <div style="flex:1;">
          <label>時間帯</label>
          <select id="fTimeOfDay" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
            <option value="">なし</option>
            <option value="朝練">朝練</option>
            <option value="午前練">午前練</option>
            <option value="午後練">午後練</option>
            <option value="夜練">夜練</option>
          </select>
        </div>
      </div>
    </div>
    <div class="field">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>種目</label>
          <select id="categorySelect" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;"></select>
        </div>
        <div style="flex:1;">
          <label>メニュー</label>
          <select id="menuSelect" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
            <option value="" disabled selected>選択してください</option>
          </select>
        </div>
      </div>
      <div id="addCategoryInline" style="display:none; margin-top:8px;">
        <div style="display:flex; gap:8px;">
          <input type="text" id="newCategoryInput" placeholder="新しい種目名" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
          <button type="button" id="confirmAddCategory" style="flex:none; background:var(--accent); color:var(--accent-text); border:none; border-radius:10px; padding:0 16px; font-size:14px; font-weight:700;">追加</button>
        </div>
      </div>
      <div id="addItemInline" style="display:none; margin-top:8px;">
        <div style="display:flex; gap:8px;">
          <input type="text" id="newItemInput" placeholder="新しいメニュー名" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
          <button type="button" id="confirmAddItem" style="flex:none; background:var(--accent); color:var(--accent-text); border:none; border-radius:10px; padding:0 16px; font-size:14px; font-weight:700;">追加</button>
        </div>
      </div>
      <button type="button" id="openManage" style="background:none; border:none; color:var(--text-dim); font-size:12px; text-decoration:underline; padding:6px 0 0; display:block;">追加した種目・メニューを管理</button>
    </div>
    <div class="field">
      <div style="display:flex; gap:8px;">
        <div class="field" style="flex:1; margin-bottom:0;" id="drillField">
          <label>ドリル</label>
          <input type="text" id="fDrill" placeholder="例：Aスキップ, Bスキップ, もも上げ">
        </div>
        <div class="field" style="flex:1; margin-bottom:0;" id="shoeField">
          <label>シューズ</label>
          <select id="shoeSelect" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
            <option value="" disabled selected>選択してください</option>
          </select>
          <div id="addShoeInline" style="display:none; margin-top:8px;">
            <div style="display:flex; gap:8px;">
              <input type="text" id="newShoeInput" placeholder="新しいシューズ名" style="flex:1; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
              <button type="button" id="confirmAddShoe" style="flex:none; background:var(--accent); color:var(--accent-text); border:none; border-radius:10px; padding:0 16px; font-size:14px; font-weight:700;">追加</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="field hidden" id="repsSetsRestField">
      <label>回数・セット数・レスト</label>
      <input type="text" id="fRepsSetsRest" placeholder="例：10回×3セット, レスト60秒">
    </div>
    <div class="field" id="setField">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>具体的な距離・本数</label>
          <input type="text" id="fSetDistance" placeholder="例：400m×10, 1000m×5">
        </div>
        <div style="flex:1;">
          <label>Wind Sprint</label>
          <input type="text" id="fWindSprint" placeholder="例：100m×6">
        </div>
      </div>
    </div>
    <div class="field hidden" id="raceTimeField">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>目標タイム</label>
          <input type="text" id="fRaceTargetTime" placeholder="例：15:30">
        </div>
        <div style="flex:1;">
          <label>結果タイム</label>
          <input type="text" id="fRaceResultTime" placeholder="例：15:42">
        </div>
      </div>
    </div>
    <div class="field hidden" id="raceResultField">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>結果</label>
          <select id="fRaceResultType" style="width:100%; background:var(--surface-2); border:1px solid var(--border); color:var(--text); border-radius:10px; padding:11px 12px; font-size:16px; font-family:inherit;">
            <option value="">選択</option>
            <option value="PB">PB</option>
            <option value="SB">SB</option>
            <option value="初">初</option>
          </select>
        </div>
        <div style="flex:1;">
          <label>順位</label>
          <input type="text" id="fRacePlace" placeholder="例：3">
        </div>
      </div>
    </div>
    <div class="field" id="pacingRowField">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>設定ペース</label>
          <input type="text" id="fTargetPace" placeholder="例：70秒/400m, 3'20/km">
        </div>
        <div style="flex:1;">
          <label>実際のラップタイム</label>
          <input type="text" id="fActualLap" placeholder="例：72, 71, 70, 69, 70">
        </div>
      </div>
    </div>
    <div class="field">
      <div style="display:flex; gap:8px;">
        <div style="flex:1;">
          <label>場所</label>

<script>
const STORAGE_KEY = 'entries';
let entries = [];
let editingId = null;
let selectedRpe = null;
let selectedMenu = null;
let currentCategory = 'Run';
let customCategories = [];
let extraItems = {};
let customSurfaces = [];
let customShoes = [];
let selectedSurface = null;
let selectedShoe = null;
let profileList = ['自分'];
let activeProfile = '自分';
function scopedKey(base){ return `${base}__${activeProfile}`; }
const SURFACE_BASE_ITEMS = ['ロード','トラック','クロカン','芝','土'];
const SHOE_BASE_ITEMS = [];

const CATEGORY_BASE = ['Run','トレーニング','Bike'];
const RUN_BASE_ITEMS = ['Easy','Jog','LSD','Long Jog','Longrun','Moderate','Tempo','Threshold','Interval','Repetition','Speed','Sprint','Hill Sprint','Hill repeat','Race'];
const BIKE_BASE_ITEMS = ['Easy','Long','Tempo','Interval','Sprint'];
const CUSTOM_BASE_ITEMS = ['Easy','Long','Tempo','Interval','Speed'];
const AUX_BASE_ITEMS = [];
const COLOR_GROUPS = [
  { name:'青', color:'var(--m-blue)', items:['Easy','Jog'] },
  { name:'緑', color:'var(--m-green)', items:['LSD','Long Jog','Longrun'] },
  { name:'黄緑', color:'var(--m-yellowgreen)', items:['Moderate','Tempo','Threshold'] },
  { name:'黄色', color:'var(--m-yellow)', items:['Interval','Repetition'] },
  { name:'オレンジ', color:'var(--m-orange)', items:['Speed','Sprint'] },
  { name:'赤', color:'var(--m-red)', items:['Hill Sprint','Hill repeat'] },
  { name:'ゴールド', color:'var(--m-gold)', items:['Race'] }
];
const RUN_COLORS = {};
COLOR_GROUPS.forEach(g => g.items.forEach(item => { RUN_COLORS[item] = g.color; }));
const ADD_CATEGORY_VAL = '__add_category__';
const ADD_ITEM_VAL = '__add_item__';
const ADD_SURFACE_VAL = '__add_surface__';
const ADD_SHOE_VAL = '__add_shoe__';
const ADD_LABEL = '＋ 選択肢を追加';

function getBaseItems(cat){
  if(cat==='Run') return RUN_BASE_ITEMS;
  if(cat==='Bike') return BIKE_BASE_ITEMS;
  if(cat==='トレーニング') return AUX_BASE_ITEMS;
  return CUSTOM_BASE_ITEMS;
}
function getItemsForCategory(cat){
  return [...getBaseItems(cat), ...(extraItems[cat]||[])];
}
function colorForItem(cat, item){
  if(cat==='Run') return RUN_COLORS[item] || 'var(--border)';
  if(cat==='Bike') return 'var(--cross)';
  if(cat==='トレーニング') return 'var(--aux)';
  return 'var(--customcat)';
}

const RPE_LABELS = {1:'とても楽',2:'とても楽',3:'楽',4:'楽',5:'ややきつい',6:'ややきつい',7:'きつい',8:'きつい',9:'全力',10:'全力'};
function rpeColor(rpe){
  if(rpe<=2) return 'var(--z1)';
  if(rpe<=4) return 'var(--z2)';
  if(rpe<=6) return 'var(--z3)';
  if(rpe<=8) return 'var(--z4)';
  return 'var(--z5)';
}

const hasCloudStorage = (typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function');

function pad2(n){ return String(n).padStart(2,'0'); }
function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function daysAgoStr(n){
  const d = new Date();
  d.setDate(d.getDate() - n);
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}

async function loadEntries(){
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(scopedKey(STORAGE_KEY), false);
      entries = res && res.value ? JSON.parse(res.value) : [];
      return;
    }catch(e){ /* fall through */ }
  }
  try{
    const raw = localStorage.getItem('running_log_' + scopedKey(STORAGE_KEY));
    entries = raw ? JSON.parse(raw) : [];
  }catch(e){
    entries = [];
  }
}
async function saveEntries(){
  if(hasCloudStorage){
    try{
      await window.storage.set(scopedKey(STORAGE_KEY), JSON.stringify(entries), false);
      return;
    }catch(e){ /* fall through */ }
  }
  try{
    localStorage.setItem('running_log_' + scopedKey(STORAGE_KEY), JSON.stringify(entries));
  }catch(e){
    showToast('保存に失敗しました');
  }
}

const MENU_CONFIG_KEY = 'menuConfig';
async function loadMenuConfig(){
  let cfg = null;
  if(hasCloudStorage){
    try{
      const res = await window.storage.get(scopedKey(MENU_CONFIG_KEY), false);
      cfg = res && res.value ? JSON.parse(res.value) : null;
    }catch(e){ /* fall through */ }
  }
  if(cfg === null){
    try{
      const raw = localStorage.getItem('running_log_' + scopedKey(MENU_CONFIG_KEY));
      cfg = raw ? JSON.parse(raw) : null;
    }catch(e){ /* ignore */ }
  }
  customCategories = (cfg && cfg.customCategories) || [];
  extraItems = (cfg && cfg.extraItems) || {};
  customSurfaces = (cfg && cfg.customSurfaces) || [];
  customShoes = (cfg && cfg.customShoes) || [];
}
async function saveMenuConfig(){
  const payload = JSON.stringify({ customCategories, extraItems, customSurfaces, customShoes });
  if(hasCloudStorage){
    try{
      await window.storage.set(scopedKey(MENU_CONFIG_KEY), payload, false);
      return;
    }catch(e){ /* fall through */ }
  }
  try{
    localStorage.setItem('running_log_' + scopedKey(MENU_CONFIG_KEY), payload);
  }catch(e){ /* ignore */ }
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function computeSum(days){
  const cutoff = daysAgoStr(days - 1);
  const today = todayStr();
  return entries
    .filter(e => e.date >= cutoff && e.date <= today && (e.category||'Run') === 'Run')
    .reduce((s,e)=> s + Number(e.distance||0), 0);
}

function computeTotalTime(days){
  const cutoff = daysAgoStr(days - 1);
  const today = todayStr();
  return entries
    .filter(e => e.date >= cutoff && e.date <= today)
    .reduce((s,e)=> s + Number(e.timeMin||0) + Number(e.upTime||0) + Number(e.downTime||0), 0);
}

function computeACWR(){
  const acute = computeSum(7);
  const chronicWeeklyAvg = computeSum(28) / 4;
  if(chronicWeeklyAvg === 0) return null;
  return acute / chronicWeeklyAvg;
}

function acwrColor(v){
  if(v < 0.8) return 'var(--rest)';
  if(v <= 1.3) return 'var(--z2)';
  if(v <= 1.5) return 'var(--z4)';
  return 'var(--z5)';
}
function acwrLabel(v){
  if(v < 0.8) return '負荷やや低め';
  if(v <= 1.3) return '適正範囲';
  if(v <= 1.5) return 'やや注意';
  return '負荷急増・注意';
}

// ---- calendar ----
let viewYear, viewMonth; // viewMonth: 0-11

function initView(){
  const d = new Date();
  viewYear = d.getFullYear();
  viewMonth = d.getMonth();
}

function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }

function entriesForDate(dateStr){
  return entries.filter(e=>e.date===dateStr);
}

function renderDashboard(){
  document.getElementById('sum7').innerHTML = computeSum(7).toFixed(1) + '<span>km</span>';
  document.getElementById('sum30').innerHTML = computeSum(30).toFixed(1) + '<span>km</span>';

  const totalTime7 = computeTotalTime(7);
  const th = Math.floor(totalTime7/60), tm = Math.round(totalTime7%60);
  document.getElementById('time7').innerHTML = (th>0 ? `${th}<span>時間</span>${tm}<span>分</span>` : `${tm}<span>分</span>`);

  const acwr = computeACWR();
  const acwrEl = document.getElementById('acwr');
  const acwrSubEl = document.getElementById('acwrSub');
  if(acwr === null){
    acwrEl.textContent = '-';
    acwrEl.style.color = '';
    acwrSubEl.textContent = '\u00a0';
  } else {
    acwrEl.textContent = acwr.toFixed(2);
    acwrEl.style.color = acwrColor(acwr);
    acwrSubEl.textContent = acwrLabel(acwr);
  }
}

let ratioMetric = 'distance';

function formatRatioValue(val, metric){
  if(metric === 'frequency') return `${val}回`;
  if(metric === 'time'){
    const h = Math.floor(val/60), m = Math.round(val%60);
    return `${h}時間${m}分`;
  }
  return `${val.toFixed(1)}km`;
}

function computeColorGroupTotals(metric){
  const monthPrefix = `${viewYear}-${pad2(viewMonth+1)}`;
  const totals = COLOR_GROUPS.map(()=>0);
  const blueIdx = COLOR_GROUPS.findIndex(g => g.name === '青');

  entries.forEach(e=>{
    if((e.category||'Run') !== 'Run') return;
    if(!e.date.startsWith(monthPrefix)) return;

    const idx = COLOR_GROUPS.findIndex(g => g.items.includes(e.menu));
    if(idx !== -1){
      if(metric === 'distance') totals[idx] += Number(e.distance||0);
      else if(metric === 'frequency') totals[idx] += 1;
      else if(metric === 'time') totals[idx] += Number(e.timeMin||0);
    }

    // アップ・ダウンは青（Easy/Jog）扱いで距離・時間に加算（頻度には加算しない）
    if(blueIdx !== -1){
      if(metric === 'distance') totals[blueIdx] += Number(e.upDist||0) + Number(e.downDist||0);
      else if(metric === 'time') totals[blueIdx] += Number(e.upTime||0) + Number(e.downTime||0);
    }
  });

  return totals;
}

function renderColorBreakdown(){
  document.getElementById('colorRatioMonthLabel').textContent = `${viewYear}年${viewMonth+1}月`;

  const totals = computeColorGroupTotals(ratioMetric);
  const grandTotal = totals.reduce((s,v)=>s+v, 0);

  const el = document.getElementById('colorRatioChart');
  if(grandTotal <= 0){
    el.innerHTML = `<div class="empty" style="padding:8px 0;">この月のRunの記録がありません</div>`;
    return;
  }

  let barHtml = '<div class="ratio-bar">';
  COLOR_GROUPS.forEach((g,idx)=>{
    if(totals[idx] <= 0) return;
    const pct = (totals[idx]/grandTotal*100);
    barHtml += `<div class="seg" style="width:${pct}%; background:${g.color};"></div>`;
  });
  barHtml += '</div>';

  let legendHtml = '<div class="ratio-legend">';
  COLOR_GROUPS.forEach((g,idx)=>{
    if(totals[idx] <= 0) return;
    const pct = (totals[idx]/grandTotal*100);
    const itemsLabel = (g.name==='青') ? `${g.items.join('/')}, アップ・ダウン` : g.items.join('/');
    legendHtml += `
      <div class="row">
        <span class="dot" style="background:${g.color};"></span>
        <span class="name">${g.name}（${itemsLabel}）</span>
        <span class="pct">${pct.toFixed(0)}%</span>
        <span class="km">${formatRatioValue(totals[idx], ratioMetric)}</span>
      </div>`;
  });
  legendHtml += '</div>';

  el.innerHTML = barHtml + legendHtml;
}

document.getElementById('ratioMetricSelect').addEventListener('change', (e)=>{
  ratioMetric = e.target.value;
  renderColorBreakdown();
});

const RACE_DISTANCE_ORDER = ['800m','1000m','1500m','3000m','5000m','10000m','1mile','5km','10km','ハーフマラソン','フルマラソン'];
function renderPbTable(){
  const el = document.getElementById('pbTable');
  const pbEntries = entries.filter(e => (e.category||'Run')==='Run' && e.menu==='Race' && e.raceResultType==='PB' && e.raceDistance);

  const byDistance = {};
  pbEntries.forEach(e=>{
    if(!byDistance[e.raceDistance] || e.date > byDistance[e.raceDistance].date){
      byDistance[e.raceDistance] = e;
    }
  });

  const rows = RACE_DISTANCE_ORDER.filter(d => byDistance[d]);
  if(rows.length === 0){
    el.innerHTML = `<div class="empty" style="padding:8px 0;">まだPBの記録がありません</div>`;
    return;
  }

  el.innerHTML = rows.map(d=>{
    const e = byDistance[d];
    const dt = new Date(e.date + 'T00:00:00');
    const dateLabel = `${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
    return `
      <div class="day-row">
        <div class="date-col" style="width:64px;">${escapeHtml(d)}</div>
        <div class="mid-col"><span class="comment-hint">${dateLabel}</span></div>
        <div class="right-col">${escapeHtml(e.raceResultTime || '-')}</div>
      </div>`;
  }).join('');
}

function renderCalendar(){
  document.getElementById('monthLabel').textContent = `${viewYear}年${viewMonth+1}月`;
  const cal = document.getElementById('calendar');
  const total = daysInMonth(viewYear, viewMonth);
  const today = todayStr();
  const dowChars = ['日','月','火','水','木','金','土'];

  let html = '';
  for(let day=1; day<=total; day++){
    const dateStr = `${viewYear}-${pad2(viewMonth+1)}-${pad2(day)}`;
    const d = new Date(viewYear, viewMonth, day);
    const dow = dowChars[d.getDay()];
    const isToday = dateStr === today;

    // ---- training half ----
    const dayEntries = entriesForDate(dateStr);
    let trainHtml;
    if(dayEntries.length === 0){
      trainHtml = `<div class="mid-col"><span class="placeholder">記録なし</span></div><div class="right-col"></div>`;
    } else {
      const distSum = dayEntries.reduce((s,e)=>s+Number(e.distance||0),0);
      const chipsHtml = dayEntries.map(e=>{
        const label = e.menu || '';
        const color = colorForItem(e.category || 'Run', label);
        const todAbbr = TIME_OF_DAY_ABBR[e.timeOfDay] || '';
        const displayLabel = todAbbr ? `${label}(${todAbbr})` : label;
        return `<span class="menu-chip" style="background:${color}" onclick="openEntryById('${e.id}', event)">${escapeHtml(displayLabel)}</span>`;
      }).join('') + `<span class="menu-chip" style="background:var(--surface-2); color:var(--text-dim); border:1px dashed var(--border);" onclick="openAddForDate('${dateStr}', event)">＋</span>`;
      const commentParts = [];
      dayEntries.forEach(e=>{ if(e.setDistance) commentParts.push(e.setDistance); });
      dayEntries.forEach(e=>{ if(e.comment) commentParts.push(e.comment); });
      const commentText = commentParts.join(' / ');
      const single = dayEntries.length === 1 ? dayEntries[0] : null;
      trainHtml = `
        <div class="mid-col">
          ${chipsHtml}
          ${commentText ? `<span class="comment-hint">${escapeHtml(commentText)}</span>` : ''}
        </div>
        <div class="right-col">
          ${distSum>0 ? distSum.toFixed(1)+'km' : ''}
          ${(single && single.paceMin!=null && single.paceSec!=null) ? `<span class="rpe">${single.paceMin}:${String(single.paceSec).padStart(2,'0')}/km</span>` : ''}
          ${(single && single.rpe) ? `<span class="rpe">RPE ${single.rpe}</span>` : ''}
        </div>`;
    }

    // ---- condition half ----
    const cond = conditions[dateStr];
    let condHtml;
    if(!cond){
      condHtml = `<div class="mid-col"><span class="placeholder">-</span></div><div class="right-col"></div>`;
    } else {
      const parts = [];
      if(cond.sleepTotalMin != null){
        const h = Math.floor(cond.sleepTotalMin/60), m = cond.sleepTotalMin%60;
        parts.push(`睡眠${h}:${String(m).padStart(2,'0')}`);
      }
      if(cond.fatigue != null) parts.push(`疲労${cond.fatigue}`);
      const hrvChip = cond.hrv != null ? `<span class="menu-chip" style="background:${HRV_COLORS[cond.hrv]}">HRV${HRV_LEVELS[cond.hrv]}</span>` : '';
      const painChip = (cond.pains && cond.pains.length>0) ? `<span class="menu-chip" style="background:var(--z5)">痛み</span>` : '';
      const treatmentChip = cond.treatment ? `<span class="menu-chip" style="background:var(--aux)">治療</span>` : '';
      condHtml = `
        <div class="mid-col">
          ${hrvChip}${painChip}${treatmentChip}
          ${parts.length ? `<span class="comment-hint">${escapeHtml(parts.join(' ・ '))}</span>` : ''}
        </div>
        <div class="right-col">${cond.weight != null ? cond.weight.toFixed(1)+'kg' : ''}</div>`;
    }

    html += `
      <div class="day-row ${dayEntries.length===0?'empty':''} ${isToday?'today':''}">
        <div class="date-col">${viewMonth+1}/${day}<div class="dow">${dow}</div></div>
        <div class="train-col" onclick="handleRowTap('${dateStr}')">${trainHtml}</div>
        <div class="cond-col" onclick="openConditionSheet('${dateStr}')">${condHtml}</div>
      </div>`;
  }
  cal.innerHTML = html;
}

  delete extraItems[cat];
  await saveMenuConfig();
  buildCategorySelect();

    document.getElementById('categorySelect').value = 'Run';
    buildMenuSelectFor('Run');

  renderManageContent();
  showToast('削除しました');

  extraItems[cat] = (extraItems[cat]||[]).filter(i=>i!==item);
  await saveMenuConfig();
  if(currentCategory === cat){
    buildMenuSelectFor(cat);
  }
  renderManageContent();
  showToast('削除しました');
}

async function deleteProfile(name){
  if(profileList.length <= 1) return;
  const keysToClean = [STORAGE_KEY, MENU_CONFIG_KEY, CONDITIONS_KEY, GOALS_KEY].map(k => `${k}__${name}`);
  for(const k of keysToClean){
    if(hasCloudStorage){
      try{ await window.storage.delete(k, false); }catch(e){ /* ignore */ }
    }
    try{ localStorage.removeItem('running_log_' + k); }catch(e){ /* ignore */ }
  }
  profileList = profileList.filter(p => p !== name);
  if(activeProfile === name){
    activeProfile = profileList[0];
    await saveProfilesConfig();
    await loadProfileData();
  } else {
    await saveProfilesConfig();
  }
  renderProfileListContent();
  showToast('削除しました');
}

  profileList.push(name);

}

      </div>
      ${painRows.length>1 ? `<button type="button" class="del-btn">✕</button>` : ''}
    `;
    const partInput = div.querySelector('input[type="text"]');
    const levelInput = div.querySelector('input[type="number"]');
    partInput.value = row.part || '';
    levelInput.value = row.level || '';
    partInput.addEventListener('input', ()=>{
      painRows[idx].part = partInput.value;
      if(idx === painRows.length-1 && partInput.value.trim() !== ''){
        painRows.push({part:'', level:''});
        renderPainRows();
      }
    });
    levelInput.addEventListener('input', ()=>{ painRows[idx].level = levelInput.value; });
    const delBtn = div.querySelector('.del-btn');
    if(delBtn){
      delBtn.addEventListener('click', ()=>{
        painRows.splice(idx,1);
        if(painRows.length===0) painRows.push({part:'', level:''});
        renderPainRows();
      });
    }
    container.appendChild(div);
  });
}

function parseTimeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  if(isNaN(h) || isNaN(m)) return null;
  return h*60+m;
}
function computeSleepTotalMin(){
  const startStr = document.getElementById('condSleepStart').value;
  const endStr = document.getElementById('condSleepEnd').value;
  const napRaw = document.getElementById('condNapMin').value;
  const nap = napRaw !== '' ? parseInt(napRaw,10) : 0;
  const startMin = parseTimeToMinutes(startStr);
  const endMin = parseTimeToMinutes(endStr);
  let coreMin = null;
  if(startMin !== null && endMin !== null){
    let diff = endMin - startMin;
    if(diff <= 0) diff += 24*60;
    coreMin = diff;
  }
  if(coreMin === null && nap === 0) return null;
  return (coreMin || 0) + nap;
}
function updateSleepTotalDisplay(){
  const total = computeSleepTotalMin();
  const el = document.getElementById('condSleepTotal');
  if(total === null){
    el.textContent = '睡眠時間：-';
  } else {
    const h = Math.floor(total/60);
    const m = total%60;
    el.textContent = `睡眠時間：${h}時間${m}分`;
  }
}
['condSleepStart','condSleepEnd','condNapMin'].forEach(id=>{
  document.getElementById(id).addEventListener('input', updateSleepTotalDisplay);
  document.getElementById(id).addEventListener('change', updateSleepTotalDisplay);
});

async function handleSave(){
  const date = document.getElementById('fDate').value;
  const timeOfDay = document.getElementById('fTimeOfDay').value || '';
  const isTraining = currentCategory === 'トレーニング';
  const comment = document.getElementById('fComment').value.trim();

  if(!date){ showToast('日付を入力してください'); return; }
  if(!selectedMenu){ showToast('メニューを選んでください'); return; }

  let distance = 0;
  let extraFields;

  if(isTraining){
    const repsSetsRest = document.getElementById('fRepsSetsRest').value.trim();
    const location = document.getElementById('fLocation').value.trim();
    const rir = document.getElementById('fRir').value.trim();
    extraFields = { repsSetsRest, location, rir, timeOfDay, category: currentCategory };
  } else {
    const isRace = (selectedMenu === 'Race');
    const raceDistance = isRace ? (document.getElementById('fRaceDistance').value || '') : '';
    const distRaw = document.getElementById('fDist').value;
    distance = distRaw !== '' ? parseFloat(distRaw) : 0;
    if(isNaN(distance) || distance < 0) distance = 0;

    const paceMinRaw = document.getElementById('fPaceMin').value;
    const paceSecRaw = document.getElementById('fPaceSec').value;
    const avgHrRaw = document.getElementById('fAvgHr').value;
    const maxHrRaw = document.getElementById('fMaxHr').value;
    const paceMin = paceMinRaw !== '' ? parseInt(paceMinRaw,10) : null;
    const paceSec = paceSecRaw !== '' ? parseInt(paceSecRaw,10) : null;
    const avgHr = avgHrRaw !== '' ? parseInt(avgHrRaw,10) : null;
    const maxHr = maxHrRaw !== '' ? parseInt(maxHrRaw,10) : null;
    const setDistance = document.getElementById('fSetDistance').value.trim();
    const windSprint = document.getElementById('fWindSprint').value.trim();
    const raceTargetTime = isRace ? document.getElementById('fRaceTargetTime').value.trim() : '';
    const raceResultTime = isRace ? document.getElementById('fRaceResultTime').value.trim() : '';
    const raceResultType = isRace ? (document.getElementById('fRaceResultType').value || '') : '';
    const racePlace = isRace ? document.getElementById('fRacePlace').value.trim() : '';
    const targetPace = document.getElementById('fTargetPace').value.trim();
    const actualLap = document.getElementById('fActualLap').value.trim();
    const location = document.getElementById('fLocation').value.trim();
    const weather = document.getElementById('fWeather').value || '';
    const tempRaw = document.getElementById('fTemperature').value;
    const temperature = tempRaw !== '' ? parseFloat(tempRaw) : null;
    const wind = document.getElementById('fWind').value || '';
    const surface = selectedSurface || '';
    const shoe = selectedShoe || '';
    const timeMinRaw = document.getElementById('fTimeMin').value;
    const timeMin = timeMinRaw !== '' ? parseInt(timeMinRaw,10) : null;
    const upDownApplicable = (currentCategory === 'Run') && !isBlueOrGreenMenu(selectedMenu);
    const upDistRaw = document.getElementById('fUpDist').value;
    const upTimeRaw = document.getElementById('fUpTime').value;
    const downDistRaw = document.getElementById('fDownDist').value;
    const downTimeRaw = document.getElementById('fDownTime').value;
    const upDist = (upDownApplicable && upDistRaw !== '') ? parseFloat(upDistRaw) : null;
    const drill = document.getElementById('fDrill').value.trim();
    const upTime = (upDownApplicable && upTimeRaw !== '') ? parseInt(upTimeRaw,10) : null;
    const downDist = (upDownApplicable && downDistRaw !== '') ? parseFloat(downDistRaw) : null;
    const downTime = (upDownApplicable && downTimeRaw !== '') ? parseInt(downTimeRaw,10) : null;

    if(isRace){
      const raceKm = RACE_DISTANCE_KM[raceDistance] || 0;
      distance = raceKm + (upDist||0) + (downDist||0);
    }

    extraFields = { paceMin, paceSec, avgHr, maxHr, setDistance, windSprint, raceDistance, raceTargetTime, raceResultTime, raceResultType, racePlace, targetPace, actualLap, location, surface, shoe, weather, temperature, wind, timeMin, upDist, upTime, downDist, downTime, drill, timeOfDay, category: currentCategory };
  }

  if(editingId){
    const idx = entries.findIndex(e=>e.id===editingId);
    if(idx>-1){ entries[idx] = {...entries[idx], date, distance, rpe: isTraining ? null : selectedRpe, menu: selectedMenu, comment, ...extraFields}; }
  } else {
    entries.push({ id: Date.now().toString(36)+Math.random().toString(36).slice(2,7), date, distance, rpe: isTraining ? null : selectedRpe, menu: selectedMenu, comment, ...extraFields });
  }
  await saveEntries();

  renderColorBreakdown();
  renderPbTable();
  renderCalendar();
  closeSheet();
  showToast('保存しました');
}

function wireDoubleConfirm(btn, confirmText, action){
  btn.addEventListener('click', ()=>{
    if(btn.dataset.armed === '1'){
      btn.dataset.armed = '';
      btn.textContent = btn.dataset.original;
      action();
    } else {
      btn.dataset.original = btn.textContent;
      btn.dataset.armed = '1';
      btn.textContent = confirmText;
      clearTimeout(Number(btn.dataset.timer)||0);
      const t = setTimeout(()=>{ btn.dataset.armed=''; btn.textContent = btn.dataset.original; }, 3000);
      btn.dataset.timer = t;
    }
  });
}
